<div class="login-container">
  <mat-card class="login-card" appearance="outlined">

    <mat-card-header>
      <div class="login-brand">
        <span class="login-logo">💰</span>
        <mat-card-title>Welcome Back</mat-card-title>
        <mat-card-subtitle>Sign in to your expense tracker</mat-card-subtitle>
      </div>
    </mat-card-header>

    <mat-card-content>
      @if (errorMessage()) {
        <mat-card appearance="filled" class="error-card">
          <mat-card-content>
            <mat-icon>error_outline</mat-icon>
            {{ errorMessage() }}
          </mat-card-content>
        </mat-card>
      }

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email"
          [ngModel]="email()" (ngModelChange)="email.set($event)"
          placeholder="user@example.com"
          autocomplete="email">
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password"
          [ngModel]="password()" (ngModelChange)="password.set($event)"
          placeholder="••••••••"
          autocomplete="current-password">
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions class="login-actions">
      <button mat-raised-button color="primary" class="full-width"
        (click)="onLogin()" [disabled]="isLoading()">
        @if (isLoading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Sign In
        }
      </button>

      <mat-divider class="divider"></mat-divider>

      <button mat-stroked-button class="full-width google-btn"
        (click)="onGoogleLogin()" [disabled]="isLoading()">
        <mat-icon>login</mat-icon>
        Sign in with Google
      </button>
    </mat-card-actions>

  </mat-card>
</div>
