<mat-sidenav-container class="app-container">

  <!-- ── Sidenav (overlay on xs/sm, persistent on md+) ── -->
  <mat-sidenav #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="app-sidenav">
    <div class="sidenav-header">
      <span class="brand-logo">💰</span>
      <span class="brand-name">ExpenseTracker</span>
    </div>
    <mat-divider></mat-divider>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" (click)="isMobile && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
    </mat-nav-list>

    @if (authService.user(); as user) {
      <div class="sidenav-footer">
        <mat-divider></mat-divider>
        <div class="user-profile">
          @if (user.photoURL) {
            <img [ngSrc]="user.photoURL" width="36" height="36" alt="Profile" class="avatar">
          } @else {
            <mat-icon class="avatar-icon">account_circle</mat-icon>
          }
          <span class="user-name">{{ user.displayName || user.email }}</span>
        </div>
        <button mat-stroked-button (click)="logout()" class="btn-logout">
          <mat-icon>logout</mat-icon> Sign Out
        </button>
      </div>
    }
  </mat-sidenav>

  <!-- ── Main content area ── -->
  <mat-sidenav-content>

    <!-- Top toolbar (always visible) -->
    <mat-toolbar color="primary" class="app-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Toggle navigation">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-title">💰 ExpenseTracker</span>
      <span class="toolbar-spacer"></span>

      <!-- User avatar / logout in toolbar for quick access on desktop -->
      @if (authService.user(); as user) {
        <span class="toolbar-user">{{ user.displayName || user.email }}</span>
      }
    </mat-toolbar>

    <!-- Page content -->
    <main class="main-content">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>
</mat-sidenav-container>
